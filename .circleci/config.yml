version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install --upgrade pip
      - run:
          name: Run tests
          command: python -m unittest discover -s tests -p "test_*.py"

workflows:
  main:
    jobs:
      - test